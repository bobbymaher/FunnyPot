protocol: modbus
listen: [502]
severity: medium
tags: [protocol, modbus, ics, scada, plc, schneider, modicon]
title: Modbus TCP (Schneider Modicon M340)
framing: raw
# Modbus is strict master/slave: the client speaks first, the device never banners.
banner: ""
# Emulate identity replies only — never act on writes; nothing is stored or actuated.
# The reply frames are byte-exact: {{hex:..}} expands the binary structure at render time so the
# full-width bytes keep their real values, while the vendor/product ASCII the nuclei matchers key
# on stays literal. Match conditions compare raw request bytes (all <= 0x7F) and are not rendered.
rules:
  # Read Device Identification: FC 0x2B / MEI 0x0E. Reply carries the standard object list
  # (VendorName / ProductCode / Revision) -> nuclei matches "Schneider Electric". The conformity
  # level is the real 0x83 (extended identification, individual access) -- a byte the YAML \xNN
  # transport could not carry byte-exact. MBAP length 0x31 (49) is unchanged.
  - match: { contains: "\x2b\x0e" }
    send: "{{hex:000000000031002b0e02830000030012}}Schneider Electric{{hex:010c}}BMX P34 2020{{hex:0205}}V2.60"
  # Schneider UMAS (proprietary FC 0x5A). Framing is vendor-private; reply carries the CPU
  # model string -> nuclei matches "BMX P34" on the UMAS probe's response.
  - match: { contains: "\x5a\x00" }
    send: "{{hex:000100000025005a00000000}}BMX P34 2020{{hex:00}}Schneider Electric"
