protocol: postgresql
listen: [5432]
severity: medium
tags: [protocol, postgresql, postgres, database, db]
title: PostgreSQL Server
framing: raw
banner: ""            # client sends the StartupMessage first
# One canned backend-message stream answers any client bytes (StartupMessage or a later Query).
# It is a detection-bait composite of real Postgres message frames (big-endian ints), carrying
# every substring the three detectors read: AuthenticationSASL advertising "SCRAM-SHA-256"
# (pgsql-detect), ParameterStatus "client_encoding" + "integer_datetimes" (psql-user-enum), and
# a RowDescription with the \l+ column aliases "Owner" / "Locale Provider" / "Access privileges"
# (unauth-psql). Contains none of the detectors' negative words (HTTP, FTP, 500).
# The frame is byte-exact: message-type letters and ASCII matcher substrings stay literal;
# {{hex:..}} expands the binary framing at render time so the RowDescription varlena sentinels
# keep their real high bytes -- data type size -1 (0xFFFF) and type modifier -1 (0xFFFFFFFF) for
# every text column. The YAML \xNN transport can't carry those bytes byte-exact (they UTF-8-widen
# and shift the frame). Restoring the sentinels did not change any field width, so the
# RowDescription length 0x7b (123) is unchanged. Nothing is authenticated, executed, or stored.
default:
  send: "R{{hex:000000170000000a}}SCRAM-SHA-256{{hex:0000}}S{{hex:00000018}}server_version{{hex:00}}16.2{{hex:00}}S{{hex:00000019}}client_encoding{{hex:00}}UTF8{{hex:00}}S{{hex:00000019}}integer_datetimes{{hex:00}}on{{hex:00}}T{{hex:0000007b0004}}Name{{hex:0000000000000000000019ffffffffffff0000}}Owner{{hex:0000000000000000000019ffffffffffff0000}}Locale Provider{{hex:0000000000000000000019ffffffffffff0000}}Access privileges{{hex:0000000000000000000019ffffffffffff0000}}"
