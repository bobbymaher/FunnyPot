protocol: mongodb
listen: [27017]
severity: medium
tags: [protocol, mongodb, mongo, database, db, nosql]
title: MongoDB Server
framing: raw
banner: ""            # client sends a legacy OP_QUERY (admin.$cmd) first
# One canned OP_REPLY (opcode 1, little-endian) answers any command (ismaster / getLog /
# buildinfo). Its single BSON document carries the field names the three detectors read:
# "localTime" (mongodb-detect), "totalLinesWritten" (mongodb-unauth), and "version" +
# "maxBsonObjectSize" (mongodb-info-enum). Advertised version 7.0.30 sits OUTSIDE the
# CVE-2025-14847 vulnerable ranges, so the generic enum templates fire but that specific-CVE
# detector does not.
# The frame is byte-exact: {{hex:..}} expands the wire/BSON framing at render time so the
# little-endian length prefixes and field values keep their real high bytes -- the YAML \xNN
# transport can't carry bytes >= 0x80 byte-exact (they UTF-8-widen and shift the frame). The
# reply is a realistic hello/buildInfo/getLog composite: alongside the four detector fields it
# carries the fields a genuine 7.0 reply returns (ismaster, maxMessageSizeBytes, maxWriteBatchSize,
# min/maxWireVersion, readOnly, ok), and localTime is a real millisecond instant. The document is
# 212 bytes and the whole message 248 bytes, so both the wire messageLength (LE 0xf8 00 00 00) and
# the BSON document length (LE 0xd4 00 00 00) are genuine multi-byte prefixes with high low-bytes,
# not the single sub-128 bytes a shrunken reply would need. No command is dispatched.
default:
  send: "{{hex:f80000002a00000000000000010000000000000000000000000000000000000001000000d400000008}}ismaster{{hex:000102}}version{{hex:0007000000}}7.0.30{{hex:0010}}maxBsonObjectSize{{hex:000000000110}}maxMessageSizeBytes{{hex:00006cdc0210}}maxWriteBatchSize{{hex:00a086010009}}localTime{{hex:00009418d18f01000010}}minWireVersion{{hex:000000000010}}maxWireVersion{{hex:001500000008}}readOnly{{hex:000010}}totalLinesWritten{{hex:000400000001}}ok{{hex:00000000000000f03f00}}"
