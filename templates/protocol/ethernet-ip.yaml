protocol: ethernet-ip
listen: [44818]
severity: medium
tags: [protocol, ethernet-ip, enip, cip, ics, scada, plc, allen-bradley, rockwell]
title: EtherNet/IP CIP (Allen-Bradley CompactLogix)
framing: raw
# EtherNet/IP: the client speaks first with a List Identity request; no banner.
banner: ""
# Emulate the identity reply only. The encapsulation frame is byte-exact: {{hex:..}} expands the
# binary structure at render time so the full-width fields keep their real values, while the
# Product Name ASCII the nuclei matchers key on stays literal. The YAML \xNN transport can't carry
# bytes >= 0x80 byte-exact (they UTF-8-widen and shift every following field). Real values
# restored: socket-address sin_port 0xAF12 (44818, big-endian) and device State 0xFF. The Vendor
# ID / Device Type / Product Name identify the device as an Allen-Bradley/Rockwell PLC.
rules:
  # List Identity (ENIP command 0x0063) -> List Identity reply: encapsulation header + CPF
  # identity item (Rockwell vendor id 0x0001, PLC device type, product name). nuclei matches
  # the ASCII product prefix "1769-" (Allen-Bradley CompactLogix). Encap length 0x3f (63) and
  # CPF item length 0x39 (57) are unchanged -- restoring the high bytes altered no field width.
  - match: { prefix: "\x63\x00" }
    send: "{{hex:63003f00000000000000000000000000000000000000000001000c00390001000002af1200000000000000000000000001000e003600140b60311a066c0017}}1769-L35E Ethernet Port{{hex:ff}}"
