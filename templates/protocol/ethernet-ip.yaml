protocol: ethernet-ip
listen: [44818]
severity: medium
tags: [protocol, ethernet-ip, enip, cip, ics, scada, plc, allen-bradley, rockwell]
title: EtherNet/IP CIP (Allen-Bradley CompactLogix)
framing: raw
# EtherNet/IP: the client speaks first with a List Identity request; no banner.
banner: ""
# Emulate the identity reply only. All bytes are <= 0x7F so the YAML transport keeps the
# encapsulation frame byte-exact (bytes >= 0x80 would UTF-8-expand and shift every field).
# The socket-address port is left 0 for that reason; it is not part of any matcher. The
# Vendor ID / Device Type / Product Name ASCII the nuclei matchers key on is embedded literally.
rules:
  # List Identity (ENIP command 0x0063) -> List Identity reply: encapsulation header + CPF
  # identity item (Rockwell vendor id 0x0001, PLC device type, product name). nuclei matches
  # the ASCII product prefix "1769-" (Allen-Bradley CompactLogix).
  - match: { prefix: "\x63\x00" }
    send: "\x63\x00\x3f\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x01\x00\x0c\x00\x39\x00\x01\x00\x00\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x01\x00\x0e\x00\x36\x00\x14\x0b\x60\x31\x1a\x06\x6c\x00\x171769-L35E Ethernet Port\x03"
