protocol: telnet
listen: [23]
severity: medium
tags: [protocol, telnet, shell]
framing: line
# Accept-all login into a Cowrie-style fake shell (fake filesystem, canned commands). Every
# typed command is logged. The shell never executes anything — see Protocol\Shell\FakeShell.
banner: "\r\nUbuntu 22.04.3 LTS\r\nweb01 login: "
shell:
  hostname: web01
  home: /root
  password_prompt: "Password: "
  reject_attempts: 0        # accept the first password (raise to harvest more brute-force creds)
  motd: "\r\nWelcome to Ubuntu 22.04.3 LTS (GNU/Linux 5.15.0-91-generic x86_64)\r\n\r\n"
rules: []
