# Shared routing: every request → the funnypot front controller. Included by both the
# HTTP and HTTPS server blocks. $funnypot_https is set per-block (off / on) so PHP's
# $_SERVER['HTTPS'] reflects the real scheme.
root /app/demo;

# Let's Encrypt HTTP-01 challenge: served as a real static file from the mounted webroot,
# never handed to the honeypot. `^~` wins over `location /` so certbot tokens resolve.
location ^~ /.well-known/acme-challenge/ {
    root /var/acme;
    default_type "text/plain";
    try_files $uri =404;
}

location / {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_param SCRIPT_FILENAME /app/demo/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $funnypot_https;
    fastcgi_read_timeout 15s;
}
