# funnypot listens on the common HTTP and alt-HTTP ports scanners sweep, plus HTTPS
# (self-signed) on the common TLS ports. Every port routes to the same front controller.
# Ports grounded in the web/alt-web ports nuclei templates + shodan queries target.

# Plain HTTP.
server {
    listen 80 default_server;
    listen 3000;
    listen 5000;
    listen 8000;
    listen 8008;
    listen 8080;
    listen 8081;
    listen 8088;
    listen 8090;
    listen 8161;
    listen 8888;
    listen 8983;
    listen 9000;
    listen 9090;
    server_name _;
    server_tokens off;
    access_log off;
    set $funnypot_https off;
    include /etc/nginx/funnypot-location.conf;
}

# HTTPS with a self-signed cert (generated at container start).
server {
    listen 443 ssl default_server;
    listen 4443 ssl;
    listen 8443 ssl;
    listen 9443 ssl;
    listen 10443 ssl;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/nginx/funnypot.crt;
    ssl_certificate_key /etc/nginx/funnypot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $funnypot_https on;
    include /etc/nginx/funnypot-location.conf;
}
